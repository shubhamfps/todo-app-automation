name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov selenium webdriver-manager

      - name: Install Node.js (for Newman and frontend)
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Newman
        run: npm install -g newman

      - name: Start backend server
        working-directory: backend
        run: |
          npm install
          npm start &
          sleep 5 # wait for server to start

      - name: Start frontend server
        working-directory: frontend
        run: |
          npm install
          npm start &
          sleep 5 # wait for frontend to start

      - name: Run UI tests with coverage
        run: |
          pytest test_todo_crud.py --cov=./ --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml

      - name: Run API tests with Newman
        run: |
          newman run postman/todo-api-tests.postman_collection.json

      - name: Save screenshots on failures (optional)
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: screenshots
          path: screenshots/
